name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_CHAT_MODE: mock
      - name: Smoke test against the built app (mock answers)
        env:
          NEXT_PUBLIC_CHAT_MODE: mock
        run: |
          npx next start -p 3100 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:3100/en > /dev/null && break; sleep 1; done
          node scripts/smoke.mjs http://localhost:3100
