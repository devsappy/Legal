name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: http://127.0.0.1:4100   # compiled into the frontend's /api rewrite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_CHAT_MODE: mock
      - name: Smoke test the built frontend against the backend (mock answers)
        env:
          NEXT_PUBLIC_CHAT_MODE: mock
        run: |
          (cd apps/backend && PORT=4100 npx tsx src/server.ts > ../../backend.log 2>&1 &)
          (cd apps/frontend && npx next start -p 3100 > ../../frontend.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs http://localhost:4100/api/procedures > /dev/null && break; sleep 1; done
          for i in $(seq 1 30); do curl -fs http://localhost:3100/en > /dev/null && break; sleep 1; done
          node apps/frontend/scripts/smoke.mjs http://localhost:3100 || { cat backend.log frontend.log; exit 1; }
